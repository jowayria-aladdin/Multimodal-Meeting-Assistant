services:
  orchestrator:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: meeting_orchestrator
    ports:
      - "5000:5000"
    environment:
      - ASR_API_URL=http://asr_api:5002/predict
      - SIGN_API_URL=http://sign_api:5001/predict
      - OLLAMA_URL=${OLLAMA_URL}
      - QWEN_MODEL=${QWEN_MODEL}
      - INTERNAL_SECRET=${INTERNAL_SECRET}
      - BACKEND_URL=${BACKEND_URL}
    depends_on:
      - asr_api
      - sign_api
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  asr_api:
    build:
      context: ./asr_service
      dockerfile: Dockerfile.asr.cpu
    container_name: meeting_asr
    ports:
      - "5002:5002"
    environment:
      - PYANNOTE_API_KEY=${PYANNOTE_API_KEY}
      - PYANNOTEAI_API_KEY=${PYANNOTEAI_API_KEY}
      - HF_HOME=${HF_CACHE_CONTAINER}
    volumes:
      - ${HF_CACHE_PATH}:${HF_CACHE_CONTAINER}
    restart: unless-stopped

  sign_api:
    build:
      context: ./sign_service
      dockerfile: Dockerfile.sign
    container_name: meeting_sign
    ports:
      - "5001:5001"
    restart: unless-stopped