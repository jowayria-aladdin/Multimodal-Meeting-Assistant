services:
  orchestrator:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: meeting_orchestrator
    ports:
      - "${ORCHESTRATOR_PORT}:5000"
    environment:
      - ASR_API_URL=${ASR_API_URL}
      - SIGN_API_URL=${SIGN_API_URL}
      - LLM_MODE=${LLM_MODE}
      - QWEN_MODEL=${QWEN_MODEL}
      - OLLAMA_URL=${OLLAMA_URL}
      - LOCAL_PARALLEL=${LOCAL_PARALLEL}
    depends_on:
      - asr_api
      - sign_api
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  asr_api:
    build:
      context: ./asr_service
      dockerfile: Dockerfile.asr
    container_name: meeting_asr
    ports:
      - "${ASR_PORT}:5002"
    volumes:
      - "${HF_CACHE_PATH}:${HF_CACHE_CONTAINER}"
    environment:
      - PYANNOTE_API_KEY=${PYANNOTE_API_KEY}
      - HF_HOME=${HF_CACHE_CONTAINER}
      - TRANSFORMERS_CACHE=${HF_CACHE_CONTAINER}
      - HUGGINGFACE_HUB_CACHE=${HF_CACHE_CONTAINER}
    gpus: all
    restart: unless-stopped

  sign_api:
    build:
      context: ./sign_service
      dockerfile: Dockerfile.sign
    container_name: meeting_sign
    ports:
      - "${SIGN_PORT}:5001"
    restart: unless-stopped